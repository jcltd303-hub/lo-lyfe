name: Resolve Supabase dependencies
on:
  push:
    branches: [feat/catalog-foundation]
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --filter @lo-lyfe/web @supabase/supabase-js @supabase/ssr --save-exact
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-lockfile
          path: |
            apps/web/package.json
            pnpm-lock.yaml
